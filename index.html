<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMBULANCE TRACKER</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <img src="/landing-page/assets/background.png" alt="background" class="background-image" />

    <nav>
        <div><img src="/landing-page/assets/logo.png" alt="logo"></div>
        <div>Am<span style="color:rgb(255, 0, 0); font-weight: bold;">Tracker</span></div>
    </nav>

    <section class="hero">
        <div class="hero-title">Every <span style="color: red;">Second</span>, Saves <span style="color: red;">Lives</span>.</div>
        <div class="hero-description">Get real-time updates on your ambulance's location and estimated arrival time.</div>
        <div class="admin-btn"><a href="/hospital-frontend/index.html">Register</a></div>
    </section>

    <section class="cards">
        <div class="card">
            <div><img src="/landing-page/assets/location-pin.png" alt=""></div>
            <div>Real-time Tracking</div>
            <div>Live location of ambulances</div>
        </div>
        <div class="card">
            <div><img src="/landing-page/assets/lightning.png" alt=""></div>
            <div>Fast Response</div>
            <div>Quick dispatch and response times</div>
        </div>
        <div class="card">
            <div><img src="/landing-page/assets/shield.png" alt=""></div>
            <div>Reliable Service</div>
            <div>Trustworthy and dependable ambulance service</div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
